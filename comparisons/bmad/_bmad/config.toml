# BMad central config (team scope), as written by `npx bmad-method install` (v6.12.4).
# Layout per tools/installer/core/manifest-generator.js: [core], [modules.<code>], [agents.<code>].
# User-scope answers (user_name, communication_language, user_skill_level) also go to
# _bmad/config.user.toml; overrides live in _bmad/custom/config.toml (never touched by the installer).
# GUESS: exact value form (relative vs. {project-root}-prefixed) and the [agents.*] tables,
# which the installer copies from src/bmm-skills/module.yaml and are omitted here.

[core]
user_name = "sebastian"
project_name = "solar-system"
communication_language = "English"
document_output_language = "English"
output_folder = "_bmad-output"

[modules.bmm]
user_skill_level = "intermediate"
planning_artifacts = "_bmad-output/planning-artifacts"
implementation_artifacts = "_bmad-output/implementation-artifacts"
project_knowledge = "docs"
