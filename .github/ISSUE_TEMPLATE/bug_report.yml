name: Bug report
description: Something in the sor command, the plugin or the VS Code extension does not work as the spec says
labels: [bug]
body:
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      options:
        - sor command
        - Claude Code plugin
        - VS Code extension
        - SPEC.md (the format)
        - Example project
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands you ran, and the output if something failed.
  - type: input
    id: version
    attributes:
      label: Version
      description: The plugin or extension version, or the commit of the repository.
