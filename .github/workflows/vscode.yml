# Builds the VS Code extension (editors/vscode) as a .vsix.
#
# Pushes and pull requests that touch editors/vscode or tools/: install the dependencies from the lock file, check that
# the copy of the sor tool inside the extension (editors/vscode/tools) is current, run the grammar test and the
# bundled-tool test, package, and check what went into the package. The integration test (`node test/run.js`) is not
# run here: it drives a real VS Code window that has to take focus, which a CI runner cannot promise. Run it on your
# own machine.
#
# Release: push a tag `vscode-v<version>` where <version> is the one in editors/vscode/package.json,
#   git tag vscode-v0.9.7 && git push origin vscode-v0.9.7
# The .vsix is then attached to a GitHub release, and it gets a build provenance attestation. Check a downloaded file with
#   gh attestation verify sor-vscode-0.9.7.vsix --repo sebastianrath/specofrecord
# A later job publishes that file to the Visual Studio Marketplace once the publisher and the VSCE_PAT secret exist.
name: VS Code extension

on:
  push:
    branches: [main]
    paths: ['editors/vscode/**', 'tools/**', 'plugins/sync-tools.sh', '.github/workflows/vscode.yml']
    tags: ['vscode-v*']
  pull_request:
    paths: ['editors/vscode/**', 'tools/**', 'plugins/sync-tools.sh', '.github/workflows/vscode.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vscode-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  vsix:
    name: Build the .vsix
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      # Packaging needs none of the install scripts (keytar and vsce-sign are for publishing and signing), and they
      # would need a native build when a prebuilt download fails.
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/vscode-v')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$version" != "${GITHUB_REF_NAME#vscode-v}" ]; then
            echo "package.json says version $version but the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Bundled sor tool is current
        working-directory: ${{ github.workspace }}
        run: sh plugins/sync-tools.sh --check
      - name: Grammar test
        run: node test/grammar.js
      # The extension ships the JavaScript sor tool (tools/, from tools/js) and always runs it, on the editor's own Node. This
      # runs that copy away from the repository.
      - name: Bundled tool test
        run: node test/bundle.js
      # The extension has no runtime dependencies (it needs only `vscode` and Node's own modules), so vsce skips the
      # dependency scan: it is the step that breaks across npm versions. vsce takes `--out dist/` for a folder only when
      # the folder exists, and otherwise writes a file named dist.
      - name: Package
        run: |
          mkdir -p dist
          npm run package -- --no-dependencies --out dist/
      - name: Check what is in the package
        run: |
          set -e
          vsix=$(ls dist/*.vsix)
          echo "$vsix"
          unzip -Z1 "$vsix" | sort > contents.txt
          cat contents.txt
          for wanted in extension/package.json extension/src/extension.js extension/syntaxes/sor.tmLanguage.json \
                        extension/tools/sor.js extension/tools/sorlib/status.js extension/tools/sorlib/views.js; do
            grep -qx "$wanted" contents.txt || { echo "missing from the package: $wanted" >&2; exit 1; }
          done
          if grep -E '^extension/(test|sor|node_modules)/|\.py$|__pycache__|\.pyc$' contents.txt; then
            echo "files that must not ship are in the package" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: editors/vscode/dist/*.vsix
          if-no-files-found: error

  # Signs a build provenance attestation for the .vsix: GitHub records which repository, workflow, tag and commit built it.
  # A separate job, so the permission to sign sits only here and not in the job that installs npm packages and runs the tests.
  # The JavaScript tool in the extension runs on the Node of VS Code, and VS Code 1.80 (the oldest the extension supports) has Node 16. The build above
  # uses Node 20, so this job runs the tool and its tests on Node 16 and keeps the claim "Node 16 or later" (tools/js/package.json) honest.
  oldest-node:
    name: The JavaScript tool on Node 16
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 16
      - name: Vectors
        run: node tools/js/test/vectors.js
      - name: Bundled tool test
        run: node editors/vscode/test/bundle.js
      # compares the tool with the Python tool, which the runner has, on a project in many states and on anchors in every language
      - name: The tool against the Python tool
        run: python3 -m unittest discover -s tools/py -p 'test_sor_js*.py'

  attest:
    name: Attest the .vsix
    if: startsWith(github.ref, 'refs/tags/vscode-v')
    needs: [vsix, oldest-node]   # a release needs the tool to work on the oldest Node too
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: dist
      - uses: actions/attest@v4
        with:
          subject-path: dist/*.vsix

  release:
    name: Attach the .vsix to a release
    if: startsWith(github.ref, 'refs/tags/vscode-v')
    needs: attest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: dist
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#vscode-v}"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.vsix --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.vsix --repo "$GITHUB_REPOSITORY" \
              --title "VS Code extension $version" --generate-notes
          fi

  # Publishes the same attested .vsix to the Visual Studio Marketplace. It waits for the release job, and for you: the job
  # uses the environment `marketplace`, which you set up in the repository settings with yourself as a required reviewer
  # and the secret VSCE_PAT. Until that secret exists the job says so and skips, so tags keep working before the publisher does.
  # Global Azure DevOps tokens are retired on 2026-12-01; this step then needs Microsoft Entra ID (`vsce publish --azure-credential`).
  publish:
    name: Publish to the Marketplace
    if: startsWith(github.ref, 'refs/tags/vscode-v')
    needs: release
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::notice::VSCE_PAT is not set in the marketplace environment, so nothing was published to the Marketplace."
            exit 0
          fi
          npx --yes @vscode/vsce@3 publish --packagePath dist/*.vsix
