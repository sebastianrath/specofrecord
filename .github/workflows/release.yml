# Makes a release: the plugin zip and the VS Code extension's .vsix, each with a build provenance attestation, in ONE GitHub release.
#
# Push a tag `v<version>`,
#   git tag -s v0.1.17 -m v0.1.17 && git push origin v0.1.17
# The version of a release is the tag's, and the whole repository has one version: set the version fields in
# plugins/specofrecord/.claude-plugin/plugin.json, editors/vscode/package.json (and its lock file) and tools/js/package.json to
# the tag's version, commit, and only then tag. A build fails when its version is not the tag's.
# The two build workflows (plugin.yml, vscode.yml) run first as they do on a push. Only when both pass does one job sign the
# attestations and create the release. It has to be one job: GitHub locks a published release, so a second job could no longer
# attach its file to it.
#
# The release holds
#   sor-plugin-v<version>.zip and its .sha256
#   sor-vscode-v<version>.vsix
#   <file>.attestation.jsonl for each of the two files (the attestation receipt, the same files are also in the run's artifacts)
# Check a download against this repository, online
#   gh attestation verify sor-vscode-v0.1.17.vsix --repo sebastianrath/specofrecord
# or offline with the receipt next to it
#   gh attestation verify sor-vscode-v0.1.17.vsix --repo sebastianrath/specofrecord --bundle sor-vscode-v0.1.17.vsix.attestation.jsonl
#
# A last job publishes the .vsix to the Visual Studio Marketplace once the publisher and the VSCE_PAT secret exist.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:   # on a branch it is a dry run that releases nothing

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plugin:
    name: Plugin
    uses: ./.github/workflows/plugin.yml

  vscode:
    name: VS Code extension
    uses: ./.github/workflows/vscode.yml

  release:
    name: Attest and release
    needs: [plugin, vscode]   # both build workflows have to pass, and they name the artifacts
    runs-on: ubuntu-latest
    # The permission to sign and to write the release sits only here, not in the jobs that run the tests and install npm packages.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          name: ${{ needs.plugin.outputs.artifact }}
          path: dist
      - uses: actions/download-artifact@v4.3.0
        with:
          name: ${{ needs.vscode.outputs.artifact }}
          path: dist
      # GitHub records which repository, workflow, tag and commit built each file.
      - id: attest_plugin
        uses: actions/attest@v4.2.2
        with:
          subject-path: dist/*.zip
      - id: attest_vsix
        uses: actions/attest@v4.2.2
        with:
          subject-path: dist/*.vsix
      # The receipts: the signed attestation of each file, to keep next to it and to check without asking GitHub.
      - name: Keep the attestation receipts
        env:
          PLUGIN_BUNDLE: ${{ steps.attest_plugin.outputs.bundle-path }}
          VSIX_BUNDLE: ${{ steps.attest_vsix.outputs.bundle-path }}
        run: |
          cp "$PLUGIN_BUNDLE" "dist/$(basename dist/*.zip).attestation.jsonl"
          cp "$VSIX_BUNDLE" "dist/$(basename dist/*.vsix).attestation.jsonl"
          ls -l dist
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: attestations-${{ github.ref_name }}
          path: dist/*.attestation.jsonl
          if-no-files-found: error
      # Only on a tag. Run by hand on a branch, everything above is a dry run: it builds, attests and keeps the receipts, nothing is released.
      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
          fi

  # Publishes the same attested .vsix to the Visual Studio Marketplace. It waits for the release job, and for you: the job
  # uses the environment `marketplace`, which you set up in the repository settings with yourself as a required reviewer
  # and the secret VSCE_PAT. Until that secret exists the job says so and skips, so tags keep working before the publisher does.
  # Global Azure DevOps tokens are retired on 2026-12-01; this step then needs Microsoft Entra ID (`vsce publish --azure-credential`).
  publish:
    name: Publish to the Marketplace
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [vscode, release]
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          name: ${{ needs.vscode.outputs.artifact }}
          path: dist
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - name: Publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::notice::VSCE_PAT is not set in the marketplace environment, so nothing was published to the Marketplace."
            exit 0
          fi
          npx --yes @vscode/vsce@4 publish --packagePath dist/*.vsix
